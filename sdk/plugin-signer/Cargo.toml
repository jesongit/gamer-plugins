[package]
name = "gamer-plugin-signer"
version = "0.2.0"
edition = "2021"
description = "官方插件打包工具：pack（无签名 .gplugin）/ inspect（manifest 元数据）/ verify（归档自检）。keygen/sign 仅作 legacy 保留，默认构建链不调用。"

[dependencies]
sha2 = "0.10"
zip = "2"
serde_json = "1"
# manifest.toml 解析（manifest v2：[execution] kind=wasm|builtin + 元数据收敛的唯一权威源）
toml = "0.8"
# legacy sign/keygen 子命令（默认链不调用）：
ed25519-dalek = "2"
base64 = "0.22"
rand = "0.8"
