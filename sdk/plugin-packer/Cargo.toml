[package]
name = "gamer-plugin-packer"
version = "0.2.0"
edition = "2021"
description = "官方插件打包工具：pack（无签名 .gplugin）/ inspect（manifest 元数据）/ verify（归档自检）。"

[dependencies]
sha2 = "0.10"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
jsonschema = { version = "=0.58.6", default-features = false }
# manifest.toml 解析（manifest v2：[execution] kind=wasm|builtin + 元数据收敛的唯一权威源）
toml = "0.8"
