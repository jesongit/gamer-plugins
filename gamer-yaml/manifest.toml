manifest_version = 2
id = "gamer-yaml"
version = "0.3.30"
name = "自动化"
description = "自动化：按用户步骤编写脚本、脚本版本管理、素材与运行验证"
entry = "plugin.wasm"
permissions = ["ui.host", "device.read", "device.app", "input.tap", "input.swipe", "input.key", "input.text", "vision.match", "vision.color", "vision.ocr", "resource.read", "resource.write", "runtime.sleep", "log.write", "notify.send", "media.stream"]

# 支持的 Android 应用（`*` = 通用；缺省/空同 `*`）。宿主不做硬门禁，
# Console 壳按当前设备应用过滤插件入口。
[targets.android]
packages = ["*"]

[host_api]
ui = "^1.1"
device = "^1.0"
vision = "^1.0"
input = "^1.1"
resource = "^1.0"
runtime = "^1.0"
log = "^1.0"
media = "^1.0"

# 独立 WASM guest：真实 plugin.wasm，按调用惰性实例化（无实例执行模型）。
[execution]
kind = "wasm"
host_version = ">=0.5.13"

# runtime = "core"：面板由宿主 Vue 组件渲染，component 键由前端
# core-component-registry 解释（console.scripts = 自动化工作台，含脚本工作稿/素材/模板/旧候选历史/运行日志）。

[[ui.contributions]]
panel_id = "automation"
title = "自动化"
icon = "⚙️"
order = 25
location = "console.right"
runtime = "core"
entry = "ui/plugin.js"
requires_device = false
preferred_width = 440
component = "console.scripts"
[[dependencies]]
id = "gamer-notify"
version = "^0.1"
required = false


[[dependencies]]
id = "gamer-live"
version = "^0.2.6"
required = false

# Explicit external Agent tools. Installed older manifests remain unexposed.

[[tools]]
tool_id = "grammar"
action = "external.syntax"
description = "Read the authoritative unversioned YAML guide in bounded text pages."
input_schema = "schemas/external_grammar.json"
required_scopes = ["plugin.gamer-yaml.read"]
required_permissions = ["resource.read"]
effect = "read"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "functions"
action = "external.functions"
description = "Read native function schemas and the current Package function library sources."
input_schema = "schemas/external_functions.json"
required_scopes = ["plugin.gamer-yaml.read"]
required_permissions = ["resource.read"]
effect = "read"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "draft_list"
action = "external.draft_list"
description = "List script drafts and their immutable version identities."
input_schema = "schemas/external_draft_list.json"
required_scopes = ["plugin.gamer-yaml.read"]
required_permissions = ["resource.read"]
effect = "read"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "draft_get"
action = "external.draft_get"
description = "Read exact selected YAML version or paginated history (default 5, max 20), preserving metadata without private template bytes."
input_schema = "schemas/external_draft_get.json"
required_scopes = ["plugin.gamer-yaml.read"]
required_permissions = ["resource.read"]
effect = "read"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "draft_create"
action = "external.draft_create"
description = "Create an empty private script draft. Existing draft/formal script names are rejected."
input_schema = "schemas/external_draft_create.json"
required_scopes = ["plugin.gamer-yaml.draft.write", "plugin.gamer-yaml.read"]
required_permissions = ["resource.read"]
effect = "draft_write"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "draft_import"
action = "external.draft_import"
description = "Explicitly import an existing formal script into a new private draft; does not publish."
input_schema = "schemas/external_draft_import.json"
required_scopes = ["plugin.gamer-yaml.draft.write", "plugin.gamer-yaml.read"]
required_permissions = ["resource.read"]
effect = "draft_write"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "draft_save"
action = "external.draft_save"
description = "Save exact source as one new private minor version. Omitted material/template references are inherited; explicit empty arrays clear references."
input_schema = "schemas/external_draft_save.json"
required_scopes = ["plugin.gamer-yaml.draft.write", "plugin.gamer-yaml.read"]
required_permissions = ["resource.read"]
effect = "draft_write"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "draft_diff"
action = "external.draft_diff"
description = "Compare the exact sources of two existing immutable versions."
input_schema = "schemas/external_draft_diff.json"
required_scopes = ["plugin.gamer-yaml.read"]
required_permissions = ["resource.read"]
effect = "read"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "draft_validate"
action = "external.draft_validate"
description = "Validate syntax, references and selected saved screenshot/template matches. This never executes input or proves game completion."
input_schema = "schemas/external_draft_validate.json"
required_scopes = ["plugin.gamer-yaml.validate", "plugin.gamer-yaml.read"]
required_permissions = ["resource.read"]
effect = "read"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "draft_run"
action = "external.draft_run"
description = "Submit one immutable private version through the production interpreter and input barriers. The run is cancelled if this credential expires or is revoked. No publication."
input_schema = "schemas/external_draft_run.json"
required_scopes = ["plugin.gamer-yaml.draft.run", "plugin.gamer-yaml.read", "run.submit"]
required_permissions = ["resource.read", "device.read", "input.tap"]
effect = "run_submit"
[tools.context]
package_field = "package_id"
device_field = "device_id"

[[tools]]
tool_id = "template_read"
action = "external.template_read"
description = "Read a formal template or a selected draft template as a real PNG image. Draft reads require script_id and expected_version."
input_schema = "schemas/external_template_read.json"
required_scopes = ["plugin.gamer-yaml.read"]
required_permissions = ["resource.read"]
effect = "read"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "draft_crop"
action = "external.draft_crop"
description = "Crop an authorized original PNG into a uniquely named private grayscale template and create a new minor version. rect uses original PNG pixels."
input_schema = "schemas/external_draft_crop.json"
required_scopes = ["plugin.gamer-yaml.draft.write", "plugin.gamer-yaml.read"]
required_permissions = ["resource.read"]
effect = "draft_write"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "draft_match"
action = "external.draft_match"
description = "Match a selected draft template against one authorized saved frame. Returns NCC evidence only, without input or branch execution."
input_schema = "schemas/external_draft_match.json"
required_scopes = ["plugin.gamer-yaml.validate", "plugin.gamer-yaml.read"]
required_permissions = ["resource.read"]
effect = "read"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "legacy_list"
action = "external.legacy_list"
description = "List archived candidate records without editing their original files."
input_schema = "schemas/external_legacy_list.json"
required_scopes = ["plugin.gamer-yaml.history.read"]
required_permissions = ["resource.read"]
effect = "read"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "legacy_get"
action = "external.legacy_get"
description = "Read an archived candidate and verification metadata. Historical checks are not current execution proof."
input_schema = "schemas/external_legacy_get.json"
required_scopes = ["plugin.gamer-yaml.history.read"]
required_permissions = ["resource.read"]
effect = "read"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "legacy_export"
action = "external.legacy_export"
description = "Export exact original candidate JSON or snapshot bytes in bounded base64 chunks; combine all parts client side."
input_schema = "schemas/external_legacy_export.json"
required_scopes = ["plugin.gamer-yaml.history.read"]
required_permissions = ["resource.read"]
effect = "read"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "legacy_import"
action = "external.legacy_import"
description = "Explicitly import one archived candidate into a NEW script name, freezing its templates, function sources and evidence references. Original files are untouched."
input_schema = "schemas/external_legacy_import.json"
required_scopes = ["plugin.gamer-yaml.draft.write", "plugin.gamer-yaml.read", "plugin.gamer-yaml.history.read"]
required_permissions = ["resource.read"]
effect = "draft_write"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "history"
action = "external.history"
description = "Read publication and atomic resource transaction history. Does not rollback or publish."
input_schema = "schemas/external_history.json"
required_scopes = ["plugin.gamer-yaml.history.read"]
required_permissions = ["resource.read"]
effect = "read"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "draft_publish_preview"
action = "external.draft_publish_preview"
description = "Read the exact immutable draft source SHA256 and current formal resource SHA256 needed for publication. Does not publish or run."
input_schema = "schemas/external_draft_publish_preview.json"
required_scopes = ["plugin.gamer-yaml.read"]
required_permissions = ["resource.read"]
effect = "read"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "draft_publish"
action = "external.draft_publish"
description = "Publish exactly the previewed immutable version through the existing atomic script/template transaction. Requires draft head, source and formal-resource SHA256 pins. Does not run or retarget tasks."
input_schema = "schemas/external_draft_publish.json"
required_scopes = ["plugin.gamer-yaml.publish", "plugin.gamer-yaml.read"]
required_permissions = ["resource.read", "resource.write"]
effect = "resource_write"
[tools.context]
package_field = "package_id"
