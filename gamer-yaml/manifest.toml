manifest_version = 2
id = "gamer-yaml"
version = "3.3.13"
name = "自动化"
description = "自动化：YAML V1 脚本、函数库与模板的制作与运行"
entry = "plugin.wasm"
permissions = ["ui.host", "device.read", "device.app", "input.tap", "input.swipe", "input.key", "input.text", "vision.match", "vision.color", "resource.read", "runtime.sleep", "log.write"]

# 支持的 Android 应用（`*` = 通用；缺省/空同 `*`）。宿主不做硬门禁，
# Console 壳按当前设备应用过滤插件入口。
[targets.android]
packages = ["*"]

[host_api]
ui = "^1.0"
device = "^1.0"
vision = "^1.0"
input = "^1.0"
resource = "^1.0"
runtime = "^1.0"
log = "^1.0"

# 独立 WASM guest：真实 plugin.wasm，按调用惰性实例化（无实例执行模型）。
[execution]
kind = "wasm"

# runtime = "core"：面板由宿主 Vue 组件渲染，component 键由前端
# core-component-registry 解释（console.scripts = 自动化编辑器、
# console.functions = 函数库模式、console.templates = 模板框选）。

[[ui.contributions]]
panel_id = "automation"
title = "自动化"
icon = "⚙️"
order = 25
location = "console.right"
runtime = "core"
entry = "ui/plugin.js"
requires_device = true
preferred_width = 440
component = "console.scripts"

[[ui.contributions]]
panel_id = "functions"
title = "函数"
icon = "ƒ"
order = 30
location = "console.right"
runtime = "core"
entry = "ui/plugin.js"
requires_device = false
preferred_width = 440
component = "console.functions"

[[ui.contributions]]
panel_id = "templates"
title = "模板"
icon = "🖼️"
order = 35
location = "console.right"
runtime = "core"
entry = "ui/plugin.js"
requires_device = true
preferred_width = 440
component = "console.templates"
