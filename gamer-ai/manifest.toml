manifest_version = 2
id = "gamer-ai"
version = "0.4.0"
name = "AI 助手"
description = "Agent 对话、攻略记忆、设备游玩与自动化生成和事后诊断"
permissions = ["ui.host", "ai.connect", "resource.read", "device.read", "device.app", "input.tap", "input.swipe", "input.key", "input.text", "touch", "runtime.sleep", "log.write"]

[host_api]
ui = "^1.0"
device = "^1.0"
input = "^1.0"
touch = "^1.0"
runtime = "^1.0"
log = "^1.0"
resource = "^1.0"

[targets.android]
packages = ["*"]

[execution]
kind = "builtin"
builtin_id = "gamer-ai"
host_version = ">=0.3.0"

[[ui.contributions]]
panel_id = "ai"
title = "AI 助手"
order = 60
location = "console.right"
runtime = "core"
entry = "ui/plugin.js"
requires_device = false
component = "AiWorkspace"

[[dependencies]]
id = "gamer-yaml"
version = "^0.2"
required = false
