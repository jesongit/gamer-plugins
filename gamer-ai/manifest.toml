manifest_version = 2
id = "gamer-ai"
version = "0.2.1"
name = "AI 助手"
description = "通过持续对话引导 AI 观察和操作游戏，提供本机 MCP 接入"
permissions = ["ui.host", "ai.connect", "device.read", "device.app", "input.tap", "input.swipe", "input.key", "input.text", "touch", "runtime.sleep", "log.write"]

[host_api]
ui = "^1.0"
device = "^1.0"
input = "^1.0"
touch = "^1.0"
runtime = "^1.0"
log = "^1.0"

[targets.android]
packages = ["*"]

[execution]
kind = "builtin"
builtin_id = "gamer-ai"
host_version = ">=0.2.6"

[[ui.contributions]]
panel_id = "ai"
title = "AI 助手"
order = 60
location = "console.right"
runtime = "core"
entry = "ui/plugin.js"
requires_device = false
component = "AiWorkspace"
