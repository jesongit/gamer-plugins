manifest_version = 2
id = "gamer-ai"
version = "0.1.0"
name = "AI 游戏助手"
description = "根据自然语言目标、画面与攻略执行，支持预算、授权和人工接管"
permissions = ["ui.host", "device.read", "device.app", "input.tap", "input.swipe", "input.key", "input.text", "resource.read", "runtime.sleep", "log.write", "ai.infer", "ai.search", "notify.send"]
[host_api]
ui = "^1.1"
device = "^1.0"
input = "^1.0"
resource = "^1.0"
runtime = "^1.0"
log = "^1.0"
[targets.android]
packages = ["*"]
[execution]
kind = "builtin"
builtin_id = "gamer-ai"
host_version = ">=0.2.6"
[[dependencies]]
id = "gamer-yaml"
required = false
[[dependencies]]
id = "gamer-notify"
required = false
[[ui.contributions]]
panel_id = "assistant"
title = "AI 助手"
order = 60
location = "console.right"
runtime = "core"
entry = "ui/plugin.js"
requires_device = false
component = "AiWorkspace"
