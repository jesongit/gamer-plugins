<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gamer 观众反馈</title>
<style>
:root{color-scheme:dark;--bg:#17191c;--surface:#282a2f;--border:#3b3d42;--text:#eeece6;--muted:#b6b6ae;--accent:#edbc6c;--waiting:#a5b9cc;--running:#7dd1d7;--success:#8fc9ae;--danger:#ed9696}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{color:var(--text);font:18px/1.25 'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif;overflow-wrap:anywhere}
main{display:flex;flex-direction:column;width:100%;max-width:420px;max-height:100vh;max-height:100dvh;margin:0;padding:8px;background:var(--bg);border-radius:4px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
h1,h2,p{margin:0}h1{font-size:24px;line-height:1.2;font-weight:600}h2{font-size:15px;line-height:1.2;font-weight:500;color:var(--muted)}
#queue-total{font-size:16px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
body[data-active=true] h1{color:var(--accent)}
#connection{font-size:16px;color:var(--muted);margin:0 0 6px;line-height:1.3}#connection:empty{display:none}
#featured{padding:8px;background:var(--surface);border-radius:3px;min-width:0}
.task-heading{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.task-title{font-size:22px;line-height:1.2;font-weight:600;min-width:0}
.ticket{font-variant-numeric:tabular-nums;font-weight:500;margin-right:6px;color:var(--muted)}
.task-status{flex-shrink:0;font-size:16px;line-height:1.2;font-weight:500;color:var(--muted)}
[data-state=running] .task-status,[data-state=starting] .task-status,[data-state=cancelling] .task-status{color:var(--running)}
[data-state=awaiting_confirmation] .task-status,[data-state=review] .task-status{color:var(--accent)}[data-state=waiting] .task-status{color:var(--waiting)}
[data-state=success] .task-status{color:var(--success)}[data-state=failed] .task-status{color:var(--danger)}
.task-detail{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:3px}
.viewer{min-width:0;color:var(--muted);font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.elapsed{flex-shrink:0;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.identity{display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 8px;min-width:0}.medal{color:var(--muted);font-size:14px}.open-id{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:3px;overflow-wrap:anywhere;word-break:break-all}.quota{color:var(--muted);font-size:15px;line-height:1.35;margin-top:3px;font-variant-numeric:tabular-nums}.confirmation-time{font-size:16px;color:var(--accent);line-height:1.3;margin-top:4px;font-variant-numeric:tabular-nums}
.test-label{font-size:14px;font-weight:500;color:var(--muted);margin-right:6px}
.idle-copy{color:var(--muted);font-size:17px;line-height:1.3}
.waiting-section{display:flex;flex-direction:column;min-height:40px;flex:0 1 auto;margin-top:8px}
ol{list-style:none;margin:4px 0 0;padding:0}
.waiting-row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:7px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--border)}
.waiting-row:last-child{border-bottom:0}
.position{font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.waiting-content{display:grid;gap:3px;min-width:0}
.waiting-title{font-size:20px;font-weight:500;line-height:1.2;min-width:0;max-width:100%}
.waiting-row .viewer{margin:0;max-width:100%}.waiting-row .task-status{font-weight:400}
.empty-waiting{margin-top:4px;color:var(--muted);font-size:17px}
footer{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:18px;line-height:1.35;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}
footer[hidden]{display:none}body.stale h1{color:var(--muted)}
header,#connection,#featured,footer,.waiting-section h2,.empty-waiting{flex-shrink:0}
#waiting{min-height:0;max-height:360px;overflow:auto;overscroll-behavior:contain;scrollbar-color:#55575c var(--bg);scrollbar-width:thin}
#waiting:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent);color:#201d16}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#55575c;border-radius:3px}
</style>
</head>
<body>
<main>
  <header><h1 id="activity" role="status">等待连接</h1><span id="queue-total" aria-live="polite">0 项等待</span></header>
  <p id="connection"></p>
  <section id="featured" aria-label="当前任务或最近结果"><p class="idle-copy">正在读取互动进度…</p></section>
  <section class="waiting-section" aria-label="等待队列"><h2>等待队列</h2><ol id="waiting"></ol><p id="empty-waiting" class="empty-waiting">暂无等待任务</p></section>
  <footer id="custom-text" hidden></footer>
</main>
<script>
(() => {
  const el = id => document.getElementById(id);
  const text = (element, value) => { if (element.textContent !== value) element.textContent = value; };
  const node = (tag, content, className) => { const element = document.createElement(tag); element.textContent = content; if (className) element.className = className; return element; };
  const labels = { starting: '准备中', running: '进行中', cancelling: '取消中', review: '待核对', awaiting_confirmation: '待确认', success: '已完成', failed: '失败', cancelled: '已取消', removed: '已移除', acknowledged: '已结束', waiting: '等待' };
  let last = 0, waitingSignature = '', deadline = null, timeOffset = 0;
  const itemState = item => item.confirmation?.state === 'awaiting_confirmation' || item.phase === 'awaiting_confirmation' ? 'awaiting_confirmation' : item.state;
  function identity(item) {
    const group = node('div', '', 'identity');
    group.append(node('span', item.viewer || '观众', 'viewer'));
    if (item.medal_name) group.append(node('span', item.medal_name + ' Lv' + (item.medal_level || 0), 'medal'));
    return group;
  }
  function appendDetails(parent, item) {
    if (item.open_id) parent.append(node('p', 'open_id ' + item.open_id, 'open-id'));
    if (item.quota) {
      const quota = item.quota;
      parent.append(node('p', quota.unlimited ? '不限次数 ∞ · 预占 ' + quota.reserved : '剩余 ' + quota.remaining + ' · 预占 ' + quota.reserved + ' · 可用 ' + quota.available, 'quota'));
    }
  }
  function tick() {
    const counter = el('confirmation-time');
    if (!counter || deadline == null) return;
    const seconds = Math.max(0, Math.ceil((deadline - Date.now() - timeOffset) / 1000));
    text(counter, seconds ? '确认剩余 ' + Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0') : '确认时间已到，等待更新');
  }
  function title(item, className) {
    const heading = node('div', '', className);
    if (item.test) heading.append(node('span', '测试', 'test-label'));
    heading.append(node('span', '#' + item.number, 'ticket'), node('span', item.name || '互动任务'));
    return heading;
  }
  function render(state) {
    last = Date.now(); document.body.classList.remove('stale');
    timeOffset = Number.isFinite(state.time) ? state.time - Date.now() : 0;
    const current = state.current || null, featured = current || state.featured || null;
    const active = Boolean(current || state.device_busy);
    document.body.dataset.active = String(active);
    text(el('activity'), active ? '任务中' : '空闲中');
    text(el('queue-total'), (state.waiting_count || 0) + ' 项等待');
    text(el('connection'), state.paused ? '队列已暂停，等待主播继续' : !state.configured ? '等待主播开启互动' : state.device_busy && !current ? '等待当前操作结束' : state.connection === 'reconnecting' ? '互动正在重连' : state.connection !== 'connected' ? '互动暂未连接' : '');
    const feature = el('featured'); feature.replaceChildren();
    if (featured) {
      feature.dataset.state = itemState(featured);
      const heading = node('div', '', 'task-heading');
      heading.append(title(featured, 'task-title'), node('span', labels[itemState(featured)] || '处理中', 'task-status'));
      const detail = node('div', '', 'task-detail');
      detail.append(identity(featured));
      if (current && featured.started_at) {
        const seconds = Math.max(0, Math.floor((state.time - featured.started_at) / 1000));
        detail.append(node('span', seconds >= 60 ? '已进行 ' + Math.floor(seconds / 60) + '分' + seconds % 60 + '秒' : '已进行 ' + seconds + '秒', 'elapsed'));
      }
      feature.append(heading, detail);
      appendDetails(feature, featured);
      deadline = itemState(featured) === 'awaiting_confirmation' ? featured.confirmation?.deadline_at : null;
      if (deadline != null) { const counter = node('p', '', 'confirmation-time'); counter.id = 'confirmation-time'; feature.append(counter); tick(); }
    } else {
      feature.removeAttribute('data-state');
      deadline = null;
      feature.append(node('p', '触发互动后，会在这里显示进度。', 'idle-copy'));
    }
    const waiting = Array.isArray(state.waiting) ? state.waiting : [];
    const list = el('waiting'), signature = JSON.stringify(waiting);
    if (signature !== waitingSignature) {
      const scrollTop = list.scrollTop;
      list.replaceChildren();
      waiting.forEach((item, index) => {
        const row = node('li', '', 'waiting-row'); row.dataset.state = itemState(item) || 'waiting';
        const content = node('div', '', 'waiting-content'); content.append(title(item, 'waiting-title'), identity(item)); appendDetails(content, item);
        row.append(node('span', String(item.position || index + 1).padStart(2, '0'), 'position'), content, node('span', labels[itemState(item)] || '等待', 'task-status'));
        list.append(row);
      });
      list.scrollTop = scrollTop;
      list.tabIndex = waiting.length ? 0 : -1;
      waitingSignature = signature;
    }
    el('empty-waiting').hidden = waiting.length > 0;
    text(el('custom-text'), typeof state.text === 'string' ? state.text : '');
    el('custom-text').hidden = !state.text;
  }
  function stale() {
    if (!last || Date.now() - last > 5000) {
      document.body.classList.add('stale');
      text(el('activity'), '更新中断');
      text(el('connection'), last ? '显示上次进度，正在重试连接' : '暂时无法读取进度，正在重试连接');
    }
  }
  async function poll() {
    try {
      const response = await fetch('state', { cache: 'no-store', credentials: 'omit', signal: AbortSignal.timeout(4000) });
      if (!response.ok) throw new Error('unavailable');
      render(await response.json());
    } catch { stale(); }
    finally { setTimeout(poll, 1000); }
  }
  setInterval(() => { stale(); tick(); }, 1000); poll();
})();
</script>
</body>
</html>
