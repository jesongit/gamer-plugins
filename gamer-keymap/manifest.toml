manifest_version = 2
id = "gamer-keymap"
version = "0.1.7"
name = "键盘映射"
description = "按键映射：键盘、鼠标、手柄动作映射为设备触控与按键"
entry = "plugin.wasm"
permissions = ["ui.host", "input.tap", "input.swipe", "input.key", "touch", "resource.read", "resource.write"]

# 支持的 Android 应用（`*` = 通用；缺省/空同 `*`）。宿主不做硬门禁，
# Console 壳按当前设备应用过滤插件入口。
[targets.android]
packages = ["*"]

[host_api]
ui = "^1.1"
input = "^1.2"
touch = "^1.0"
resource = "^1.0"

# 独立 WASM guest：真实 plugin.wasm，常驻实例模型（start 持有实例）。
[execution]
kind = "wasm"
host_version = ">=0.3.0"

[[ui.contributions]]
# runtime = "core"：面板由宿主 Vue 组件渲染，component 键由前端
# core-component-registry 解释（console.keymaps = 映射面板）。
panel_id = "keymaps"
title = "键盘映射"
icon = "⌨"
order = 30
location = "console.right"
runtime = "core"
entry = "ui/plugin.js"
requires_device = true
preferred_width = 360
component = "console.keymaps"

# External tools are explicit; UI/internal actions are never exported automatically.
[[tools]]
tool_id = "grammar"
action = "profiles.grammar"
description = "读取当前键盘映射 YAML 语法、输入选择器、坐标范围和可校验示例；不切换方案或发送输入。"
input_schema = "schemas/mcp/grammar.json"
required_scopes = ["plugin.gamer-keymap.profiles.read"]
required_permissions = []
effect = "read"

[[tools]]
tool_id = "profiles_list"
action = "profiles.list"
description = "列出配置包内键盘映射资源。"
input_schema = "schemas/mcp/profiles_list.json"
required_scopes = ["plugin.gamer-keymap.profiles.read","resource.read"]
required_permissions = ["resource.read"]
effect = "read"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "profiles_read"
action = "profiles.read"
description = "读取映射 YAML 与当前资源版本。"
input_schema = "schemas/mcp/profiles_read.json"
required_scopes = ["plugin.gamer-keymap.profiles.read","resource.read"]
required_permissions = ["resource.read"]
effect = "read"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "profiles_validate"
action = "profiles.validate"
description = "仅验证映射语法和资源保存钩子，不启用或热切换。"
input_schema = "schemas/mcp/profiles_validate.json"
required_scopes = ["plugin.gamer-keymap.profiles.read","resource.read"]
required_permissions = ["resource.read"]
effect = "read"
[tools.context]
package_field = "package_id"

[[tools]]
tool_id = "profiles_write"
action = "profiles.write"
description = "经原资源钩子保存映射，更新必须带 expected_version；用户在 Gamer 选用后生效。"
input_schema = "schemas/mcp/profiles_write.json"
required_scopes = ["plugin.gamer-keymap.profiles.write","resource.write"]
required_permissions = ["resource.write"]
effect = "resource_write"
[tools.context]
package_field = "package_id"

