manifest_version = 2
id = "gamer-video"
version = "1.0.2"
name = "视频工作台"
description = "视频工作台：媒体素材库、设备录制与操作草稿生成"
permissions = ["ui.host", "media.read", "media.import", "media.record", "media.write", "media.events.read"]

# 支持的 Android 应用（`*` = 通用；缺省/空同 `*`）。宿主不做硬门禁，
# Console 壳按当前设备应用过滤插件入口。
[host_api]
ui = "^1.0"

[targets.android]
packages = ["*"]

# 可选依赖（简化计划 Phase 3）：gamer-yaml 提供「创建模板 / 生成 YAML 草稿 /
# 打开 YAML 编辑器」能力。缺失时视频工作台基础功能（导入/录制/播放/逐帧/
# 标记）不受影响，仅 YAML 相关入口降级隐藏（前端按能力发现接口判定）。
# 依赖声明不授予权限、不触发自动安装/启用。
[[dependencies]]
id = "gamer-yaml"
version = "*"
required = false

# builtin（宿主预置）执行类型：无 guest 字节、无常驻实例；执行体在宿主
# extensions/builtin.rs 注册表内（builtin_id 必须已注册才能安装）。
[execution]
kind = "builtin"
builtin_id = "gamer-video"

[[ui.contributions]]
# runtime = "core"：面板由宿主 Vue 组件渲染，component 键由前端
# core-component-registry 解释（VideoWorkbench = 视频工作台面板）。
panel_id = "video"
title = "视频"
icon = "🎬"
order = 28
location = "console.right"
runtime = "core"
entry = "ui/plugin.js"
requires_device = false
preferred_width = 440
component = "VideoWorkbench"
